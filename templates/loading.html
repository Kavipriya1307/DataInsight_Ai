<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<title>Uploading...</title>

<meta http-equiv="refresh" content="2">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

<style>

body{

background:#f4f8fc;

font-family:Poppins;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.box{

background:white;

padding:50px;

border-radius:20px;

box-shadow:0 10px 30px rgba(0,0,0,.1);

text-align:center;

width:420px;

}

.loader{

width:100%;

height:12px;

background:#ddd;

border-radius:20px;

margin-top:30px;

overflow:hidden;

}

.bar{

height:100%;

background:#2563eb;

animation:load 2s linear forwards;

}

@keyframes load{

from{

width:0%;

}

to{

width:100%;

}

}

h2{

color:#2563eb;

margin-bottom:15px;

}

p{

color:#666;

}

</style>

</head>

<body>

<div class="box">

<h2>

Analyzing Dataset...

</h2>

<p>

Please wait while DataInsight AI processes your data.

</p>

<div class="loader">

<div class="bar"></div>

</div>

</div>

</body>

</html>
