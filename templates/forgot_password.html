<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | DataInsight AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forgot_password.css') }}">

</head>

<body>

<div class="container">

<div class="box">

<h1>Forgot Password</h1>

<p>

Enter your registered email to reset your password.

</p>

<form method="POST">

<input
type="email"
name="email"
placeholder="Enter Email"
value="{{ email }}"
required>

{% if email_verified %}

<input
type="password"
name="password"
placeholder="New Password"
required>

<input
type="password"
name="confirm_password"
placeholder="Confirm Password"
required>

<button
type="submit"
name="update_password">

Update Password

</button>

{% else %}

<button
type="submit"
name="verify_email">

Verify Email

</button>

{% endif %}

{% if message %}

<p class="error">

{{ message }}

</p>

{% endif %}

{% if success %}

<p class="success">

{{ success }}

</p>

<script>

setTimeout(function(){

window.location.href="/login";

},2000);

</script>

{% endif %}

</form>

<a href="/login">

← Back to Login

</a>

</div>

</div>

</body>

</html>
