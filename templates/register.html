<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | DataInsight AI</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/register.css') }}">

</head>

<body>

    <div class="container">

        <div class="register-box">

            <h1>Create Account</h1>

            <p class="subtitle">

                Join DataInsight AI and start transforming your data into intelligent insights.

            </p>

            <form action="/register" method="POST">

                <div class="input-box">

                    <label>Full Name</label>

                    <input
                        type="text"
                        name="name"
                        placeholder="Enter your full name"
                        required>

                </div>

                <div class="input-box">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

                </div>

                <div class="input-box">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Create a password"
                        required>

                </div>

                <div class="input-box">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        required>

                </div>

                <!-- Error Message -->

                {% if message %}

                <p class="error">

                    {{ message }}

                </p>

                {% endif %}

                <!-- Success Message -->

                {% if success %}

                <p class="success">

                    {{ success }}

                </p>

                <script>

                    setTimeout(function () {

                        window.location.href = "/login";

                    }, 2000);

                </script>

                {% endif %}

                <button type="submit" class="register-btn">

                    Create Account

                </button>

            </form>

            <div class="bottom-links">

                <p>

                    Already have an account?

                    <a href="/login">

                        Login

                    </a>

                </p>

                <a href="/" class="back">

                    ← Back to Home

                </a>

            </div>

        </div>

    </div>

</body>

</html>
